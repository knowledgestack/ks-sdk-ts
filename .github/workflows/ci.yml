name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # No cache: pnpm and no --frozen-lockfile. This repository is regenerated
      # from ks-backend on every release and carries no pnpm-lock.yaml, so both
      # required a file that never exists here and failed every run. The package
      # has a single devDependency (typescript), so there is nothing meaningful
      # to lock; committing a lockfile would only need regenerating on each
      # release for no benefit.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Smoke import
        run: |
          node -e "const sdk = require('./dist'); console.log('exports:', Object.keys(sdk).slice(0, 5))"
